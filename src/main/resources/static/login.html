<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>CareerConnect | Login</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>
    <a href="#" onclick="toggleTheme()" style="position: absolute; top: 25px; right: 35px; color: #00c6d0; text-decoration: none; font-size: 1.5rem; transition: 0.3s;" onmouseover="this.style.textShadow='0 0 10px #00c6d0'" onmouseout="this.style.textShadow='none'">
        <i class="fa-solid fa-circle-half-stroke"></i>
    </a>

    <div class="auth-container">
        <img src="careerconnectlogo_final.png" alt="Logo" class="auth-logo">
        
        <div class="login-box">
            <h2>Welcome Back</h2>
            <input type="email" id="email" placeholder="Email Address">
            <input type="password" id="password" placeholder="Password">
            <button onclick="submitLogin()" class="btn">Login</button>
            <p id="responseMessage" style="margin-top: 15px; font-size: 0.9rem;"></p>
            <a href="register.html" style="display: block; margin-top: 20px; color: #ccc; text-decoration: none; font-size: 0.85rem;">Don't have an account? <b style="color: #00c6d0; font-weight: 400;">Sign Up</b></a>
        </div>
    </div>
    
    <script>
        // THEME MEMORY
        function toggleTheme() {
            document.body.classList.toggle("light-theme");
            let theme = document.body.classList.contains("light-theme") ? "light" : "dark";
            localStorage.setItem("siteTheme", theme);
        }

        // Page load hote hi purana theme check karo
        if (localStorage.getItem("siteTheme") === "light") {
            document.body.classList.add("light-theme");
        }

        async function submitLogin() {
            const email = document.getElementById('email').value.trim();
            const password = document.getElementById('password').value.trim();
            const messageDiv = document.getElementById('responseMessage');
            if (!email || !password) {
                messageDiv.innerText = "Please enter details before proceeding.";
                messageDiv.style.color = "#ff4c4c"; return;
            }
            messageDiv.innerText = "Checking..."; messageDiv.style.color = "#aaaaaa";
            try {
                const response = await fetch('/api/users/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email: email, password: password })
                });
                const resultText = await response.text();
                messageDiv.innerText = resultText;
                if(resultText === "Success") {
                    messageDiv.style.color = "#4caf50"; 
                    localStorage.setItem("userEmail", email);
                    window.location.href = "dashboard.html"; 
                } else { messageDiv.style.color = "#ff4c4c"; }
            } catch (error) { messageDiv.innerText = "Server Error!"; }
        }

        // Enter Key Event Listener
        document.addEventListener("keydown", function(event) {
            if (event.key === "Enter") {
                submitLogin();
            }
        });
    </script>
</body>
</html>
